name: GeoRescue pipeline
on:
  schedule: [{cron: "17 9 * * 1"}]    # weekly, Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      config: {description: "config file", default: "configs/duval_fl_ci.yaml"}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120             # GH-hosted job limit is 6 h; runner has ~14 GB disk, 16 GB RAM
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Restore run history + HTTP lookup cache
        uses: actions/cache@v4
        with:
          path: |
            out/runs/*/manifest.json
            out/cache
          key: georescue-${{ github.run_id }}
          restore-keys: georescue-
      - name: Tests
        run: PYTHONPATH=. uv run --extra verify pytest -q tests
      - name: Pipeline (fetch at runtime; PAO/clerk HTTP only; no deed-image/browser steps)
        run: PYTHONPATH=. uv run --extra verify georescue run --config "${{ inputs.config || 'configs/duval_fl_ci.yaml' }}"
      - name: Publish site
        run: PYTHONPATH=. uv run --extra verify georescue publish
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
