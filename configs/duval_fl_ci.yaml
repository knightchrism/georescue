# CI profile for GitHub Actions: same rules as duval_fl.yaml, but a filtered extract to fit runner limits
# (full county = ~409k features / ~584 MB GeoJSON / ~3-4 GB RAM in geopandas). Widen bbox/where as needed.
name: Duval County FL parcels (COJ CityBiz/Parcels) - CI extract
id_field: RE
expected_crs: EPSG:4326
working_crs: EPSG:2236
fields:
  RE: {type: str}
  LNAMEOWNER: {type: str}
  ACRES: {type: float}
bounds: {minx: -82.06, miny: 30.10, maxx: -81.32, maxy: 30.60, crs: EPSG:4326}
topology: {overlap_min_area: 10.0, sliver_max_area: 50.0, sliver_max_compactness: 0.02, gap_max_area: 500.0}
repair: {trim_overlaps_below_area: 0.0}
service:
  source_url: https://maps.coj.net/coj/rest/services/CityBiz/Parcels/MapServer/0
  data_path: data/real/duval_ci.geojson
  fetch_workers: 4           # be gentle with the COJ server
  max_age_hours: 0            # always refetch on CI (no persistent disk)
  # bbox: [-81.80, 30.15, -81.60, 30.35]   # optional extract; full county needed for all 41 published cases
  out_fields: OBJECTID,RE,LNAMEOWNER,ACRES
  write_corrected: false      # keep artefacts small
  pao: true
  clerk: true
  max_lookups: 40
  verify_dir: out/duval/verify   # deed-browser steps skipped; committed verdict JSON/PNGs only if present
