[project]
name = "georescue"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "jinja2>=3.1.6",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.1",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "shapely>=2.2.0",
    "streamlit>=1.66.1",
    "streamlit-folium>=0.27.4",
    "typer>=0.27.3",
]

[project.scripts]
georescue = "georescue.cli:main"
georescue-mcp = "georescue.mcp_server:main"

[project.optional-dependencies]
verify = [
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1",
]
